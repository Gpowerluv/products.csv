name: Selar Autonomous Product Creator

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  create-product:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Autonomous Generator
        run: |
          python main.py

      - name: Commit and Push Product Blueprint
        run: |
          git config --global user.name "Selar Agent"
          git config --global user.email "actions@github.com"
          git add products.csv
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-researched and generated new product blueprint"
          git pull origin main --rebase
          git push origin main

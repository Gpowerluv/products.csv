name: Selar Autonomous Product Creator

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 9 * * 1' 

permissions:
  contents: write

jobs:
  create-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Product Creator Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python product_agent.py

      - name: Commit and Push Product Blueprint Back to Repo
        run: |
          git config --global user.name "Selar Agent Bot"
          git config --global user.email "bot@github.com"
          git add generated_product_idea.txt
          git commit -m "Auto-researched and generated new product blueprint" || echo "No changes to commit"
          git push
      - name: Commit and Push Product Blueprint Back to Repo
        run: |
          git config --global user.name "Selar Agent Bot"
          git config --global user.email "bot@github.com"
          git add generated_product_idea.txt product_guide.pdf
          git commit -m "Auto-generated product blueprint and downloadable PDF" || echo "No changes to commit"
          git push
      - name: Commit and Push Product Blueprint Back to Repo
        run: |
          git config --global user.name "Selar Agent Bot"
          git config --global user.email "bot@github.com"
          git add generated_product_idea.txt product_guide.pdf archive/
          git commit -m "Auto-generated new product and saved historical archive" || echo "No changes to commit"
          git push

